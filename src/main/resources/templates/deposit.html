<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ashish Bank - Deposit Money</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 22px 6%;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-bottom: 0;
            color: #cbd5e1;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #0b1f3a;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #2563eb;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .message {
            padding: 13px;
            border-radius: 7px;
            margin: 18px 0;
            overflow-wrap: anywhere;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🏦 ASHISH BANK</h1>
        <p>Banking Management System</p>
    </header>

    <main class="container">

        <div class="card">

            <h2>💰 Deposit Money</h2>

            <p class="description">
                Enter the customer's account number and the amount
                you want to deposit.
            </p>

            <div class="message success" th:if="${successMessage}" th:text="${successMessage}">
            </div>

            <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}">
            </div>

            <form th:action="@{/deposit}" method="post">

                <label for="accountNumber">Account Number</label>

                <input type="text" id="accountNumber" name="accountNumber" th:value="${accountNumber}"
                    placeholder="Enter account number" required>

                <label for="amount">Deposit Amount (₹)</label>

                <input type="number" id="amount" name="amount" min="0.01" step="0.01" th:value="${amount}"
                    placeholder="Enter amount" required>

                <button type="submit">Deposit Money</button>

            </form>

            <a class="back" href="/">← Back to Dashboard</a>

        </div>

    </main>

    <footer>
        © 2026 Ashish Bank | Banking Management System
    </footer>

</body>

</html>
