<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Banking Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px 32px;
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.30);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background-color: #2563eb;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            color: #0f172a;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .login-button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background-color: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .success {
            background-color: #f0fdf4;
            color: #15803d;
        }

        .register-link {
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }

        .register-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>

</head>

<body>
    <main class="login-card">

        <div class="logo">₹</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Banking Management System<br>
            Login to access your account.
        </p>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" name="email" placeholder="Enter your registered email"
                    autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Enter your password"
                    autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-button">
                Login to Your Account
            </button>

        </form>

        <p class="message" th:if="${param.error}">
            Invalid email or password. Please try again.
        </p>

        <p class="message success" th:if="${param.registered}">
            Registration successful! Please log in.
        </p>

        <div class="register-link">
            New customer?
            <a th:href="@{/register}">Create an account</a>
        </div>

        <div class="security-note">
            Keep your password private. Never share it with anyone.
        </div>

    </main>

</body>

</html>
