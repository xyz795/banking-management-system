<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="main-content" style="margin-left:0; max-width:700px; margin:auto;">

        <h1>Create Customer Account</h1>
        <p>Enter customer details below.</p>

        <p th:if="${successMessage}" th:text="${successMessage}" style="color:green; margin:20px 0;"></p>

        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red; margin:20px 0;"></p>

        <form th:action="@{/create-account}" method="post"
            style="background:white; padding:25px; margin-top:25px; border-radius:12px;">

            <label for="fullName">Full Name</label><br>
            <input id="fullName" type="text" name="fullName" required maxlength="100"
                style="width:100%; padding:12px; margin:10px 0 20px;"><br>

            <label for="mobileNumber">Mobile Number</label><br>
            <input id="mobileNumber" type="tel" name="mobileNumber" pattern="[0-9]{10}" maxlength="10" minlength="10"
                required style="width:100%; padding:12px; margin:10px 0 20px;"><br>

            <label for="initialDeposit">Initial Deposit (₹)</label><br>
            <input id="initialDeposit" type="number" name="initialDeposit" min="0" step="0.01" value="0.00" required
                style="width:100%; padding:12px; margin:10px 0 20px;"><br>

            <button type="submit"
                style="background:#123b70; color:white; border:0; padding:14px 24px; border-radius:6px; cursor:pointer;">
                Create Account
            </button>

            <a href="/" style="margin-left:15px;">Back to Dashboard</a>
        </form>

    </div>

</body>

</html>
