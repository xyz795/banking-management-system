<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Banking System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
        }

        header {
            background: #123b69;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .logout {
            background: #ffffff;
            color: #123b69;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 220px;
            box-shadow: 0 2px 8px #00000015;
        }

        .card h3 {
            color: #475569;
            margin-top: 0;
        }

        .card h2 {
            color: #123b69;
            margin-bottom: 0;
        }

        .search-box {
            background: white;
            padding: 22px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        .search-box h2 {
            margin-top: 0;
            color: #123b69;
        }

        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-form button,
        .reset-button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #123b69;
            color: white;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        .reset-button {
            display: inline-block;
            margin-top: 12px;
            background: #64748b;
        }

        .message {
            margin-top: 15px;
            color: #b91c1c;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #123b69;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .section-title {
            color: #123b69;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 20px;
            }

            .container {
                padding: 12px;
            }

            .card {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Banking System - Admin Dashboard</h1>

        <form th:action="@{/logout}" method="post">
            <button class="logout" type="submit">Logout</button>
        </form>
    </header>

    <div class="container">

        <div class="cards">
            <div class="card">
                <h3>Customers Found / Total Customers</h3>
                <h2 th:text="${totalCustomers}">0</h2>
            </div>

            <div class="card">
                <h3>Balance of Listed Customers (₹)</h3>
                <h2 th:text="${totalBalance}">0</h2>
            </div>
        </div>

        <div class="search-box">
            <h2>Search Customer</h2>

            <form class="search-form" th:action="@{/admin/dashboard}" method="get">

                <input type="text" name="accountNumber" placeholder="Enter customer account number"
                    th:value="${searchAccountNumber}" required>

                <button type="submit">Search</button>
            </form>

            <a class="reset-button" th:href="@{/admin/dashboard}">
                Show All Customers
            </a>

            <p class="message" th:if="${searchMessage}" th:text="${searchMessage}">
            </p>
        </div>

        <h2 class="section-title">Customer Details</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Account Number</th>
                        <th>Customer Name</th>
                        <th>Mobile Number</th>
                        <th>Balance (₹)</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.accountNumber}"></td>
                        <td th:text="${customer.fullName}"></td>
                        <td th:text="${customer.mobileNumber}"></td>
                        <td th:text="${customer.balance}"></td>
                        <td>
                            <a th:href="@{/admin/customer-details(accountNumber=${customer.accountNumber})}" style="background:#123b69; color:white; padding:8px 12px;
              text-decoration:none; border-radius:5px;">
                                View Details
                            </a>
                        </td>
                        <td>
                            <a class="button"
                                th:href="@{/admin/customer-details(accountNumber=${customer.accountNumber})}">
                                View Details
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5">No customers found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>

</html>
