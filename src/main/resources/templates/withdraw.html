<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Money | Ashish Bank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        header {
            background: #102a43;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #102a43;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b02a37;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #102a43;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>ASHISH BANK</h1>
        <p>Secure Banking Management System</p>
    </header>

    <div class="container">

        <h2>Withdraw Money</h2>

        <div class="success" th:if="${successMessage}" th:text="${successMessage}">
        </div>

        <div class="error" th:if="${errorMessage}" th:text="${errorMessage}">
        </div>

        <form th:action="@{/withdraw}" method="post">

            <label for="accountNumber">Account Number</label>
            <input type="text" id="accountNumber" name="accountNumber" required>

            <label for="amount">Withdrawal Amount (₹)</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>

            <button type="submit">Withdraw Money</button>

        </form>

        <a class="back" href="/">← Back to Dashboard</a>

    </div>

</body>

</html>
