<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Banking Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 36px 32px;
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.30);
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 31px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            color: #0f172a;
            font-size: 27px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .password-hint {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .register-button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .register-button:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }

        .footer a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 23px;
            padding-top: 17px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .register-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>
    <main class="register-card">

        <div class="logo">₹</div>

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Banking Management System<br>
            Register to get started with online banking.
        </p>

        <form th:action="@{/register}" method="post">

            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name"
                    maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email"
                    maxlength="150" required>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>

                <input type="password" id="password" name="password" placeholder="Create a strong password"
                    autocomplete="new-password" minlength="8" maxlength="72" required>

                <p class="password-hint">
                    Password must contain at least 8 characters.
                </p>
            </div>

            <button type="submit" class="register-button">
                Create Account →
            </button>

        </form>

        <div class="footer">
            Already have an account?
            <a th:href="@{/login}">Sign In</a>
        </div>

        <div class="security-note">
            Keep your password confidential. Your account security matters.
        </div>

    </main>

</body>

</html>
