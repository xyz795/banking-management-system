<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Transfer - Banking System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
        }

        .navbar {
            background: #123b70;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: bold;
        }

        .container {
            max-width: 550px;
            margin: 45px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #123b70;
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #123b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4f91;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 16px 5%;
            }

            .navbar a {
                margin-left: 0;
                margin-right: 12px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>

</head>

<body>
    <header class="navbar">
        <h2>Banking System</h2>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/transactions}">Transactions</a>
        </nav>
    </header>
    <main class="container">
        <section class="card">
            <h1>Money Transfer</h1>
            <p class="subtitle">
                Transfer money securely from one bank account to another.
            </p>

            <div th:if="${successMessage}" class="message success" th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}">
            </div>

            <form th:action="@{/transfer}" method="post">

                <label for="senderAccountNumber">Your Account Number</label>
                <input type="text" id="senderAccountNumber" name="senderAccountNumber" th:value="${senderAccountNumber}"
                    required maxlength="30" placeholder="Enter your account number">

                <label for="receiverAccountNumber">Receiver Account Number</label>
                <input type="text" id="receiverAccountNumber" name="receiverAccountNumber"
                    th:value="${receiverAccountNumber}" required maxlength="30"
                    placeholder="Enter receiver's account number">

                <label for="amount">Transfer Amount (₹)</label>
                <input type="number" id="amount" name="amount" th:value="${amount}" required min="0.01" step="0.01"
                    placeholder="Enter amount">

                <button type="submit">Transfer Money</button>
            </form>

            <div class="note">
                <strong>Important:</strong> Verify the receiver's account number
                and transfer amount before submitting.
            </div>

        </section>

    </main>
</body>

</html>
